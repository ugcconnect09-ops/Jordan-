          <p class="lede reveal" id="contact-intro"></p>
          <div id="contact-socials"></div>
        </div>
        <form class="form reveal" id="contact-form" action="https://api.web3forms.com/submit" method="POST">
          <input type="hidden" name="access_key" value="8432781b-708f-4a04-b838-6b15ff58adf9">
          <input type="hidden" name="subject" value="New brand inquiry: Jordan Kenchen">
          <div class="hp" aria-hidden="true">
            <label>Leave this empty <input type="checkbox" name="botcheck" tabindex="-1" autocomplete="off"></label>
          </div>
          <div class="form__row">
            <div class="field">
              <label for="f-name">Name</label>
              <input id="f-name" name="name" type="text" autocomplete="name" required>
            </div>
            <div class="field">
              <label for="f-email">Email</label>
              <input id="f-email" name="email" type="email" autocomplete="email" required>
            </div>
          </div>
          <div class="field">
            <label for="f-company">Brand or company (optional)</label>
            <input id="f-company" name="company" type="text" autocomplete="organization">
          </div>
          <div class="field">
            <label for="f-message">Message</label>
            <textarea id="f-message" name="message" required></textarea>
          </div>
          <div>
            <button class="btn btn--primary" type="submit">Send inquiry</button>
          </div>
          <p class="form__status" id="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
